<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurar Credenciales - Bot Rendiciones</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    p.subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 24px; font-size: 0.9rem; }
    fieldset {
      border: 1px solid #334155;
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 12px 16px 16px;
    }
    legend { padding: 0 6px; color: #94a3b8; font-size: 0.85rem; }
    label { display: block; font-size: 0.85rem; margin-top: 10px; margin-bottom: 4px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover { background: #16a34a; }
    .error {
      background: #450a0a;
      border: 1px solid #b91c1c;
      color: #fecaca;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 Configurá tus credenciales</h1>
    <p class="subtitle">
      Se validan una sola vez contra GPS y el sistema de la empresa antes de guardarlas.
    </p>

    {{ERROR}}

    <form method="POST" action="/setup/validate">
      <input type="hidden" name="token" value="{{TOKEN}}" />

      <fieldset>
        <legend>GPS (Seguimiento Global)</legend>
        <label for="gpsUsername">Usuario</label>
        <input type="text" id="gpsUsername" name="gpsUsername" required autocomplete="off" />
        <label for="gpsPassword">Contraseña</label>
        <input type="password" id="gpsPassword" name="gpsPassword" required autocomplete="off" />
      </fieldset>

      <fieldset>
        <legend>Empresa (La Segunda)</legend>
        <label for="companyUsername">Usuario</label>
        <input type="text" id="companyUsername" name="companyUsername" required autocomplete="off" />
        <label for="companyPassword">Contraseña</label>
        <input type="password" id="companyPassword" name="companyPassword" required autocomplete="off" />
      </fieldset>

      <button type="submit">Validar y guardar</button>
    </form>
  </div>
</body>
</html>
