<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurar Credenciales - Bot Rendiciones</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="card">
    <h1>🔐 Configurá tus credenciales</h1>
    <p class="subtitle">
      Se validan una sola vez contra GPS y el sistema de la empresa antes de guardarlas.
    </p>

    {{ERROR}}

    <form method="POST" action="/app/credenciales">
      <input type="hidden" name="token" value="{{TOKEN}}" />

      <fieldset>
        <legend>GPS (Seguimiento Global)</legend>
        {{GPS_STATUS}}
        <label for="gpsUsername">Usuario</label>
        <input type="text" id="gpsUsername" name="gpsUsername" value="{{GPS_USERNAME}}" required autocomplete="off" />
        <label for="gpsPassword">Contraseña</label>
        <input type="password" id="gpsPassword" name="gpsPassword" required autocomplete="off" />
      </fieldset>

      <fieldset>
        <legend>Empresa (La Segunda)</legend>
        {{COMPANY_STATUS}}
        <label for="companyUsername">Usuario</label>
        <input type="text" id="companyUsername" name="companyUsername" value="{{COMPANY_USERNAME}}" required autocomplete="off" />
        <label for="companyPassword">Contraseña</label>
        <input type="password" id="companyPassword" name="companyPassword" required autocomplete="off" />
      </fieldset>

      <button type="submit">Validar y guardar</button>
    </form>

    <a class="back-link" href="/app?token={{TOKEN}}">← Volver al menú</a>
  </div>
</body>
</html>
